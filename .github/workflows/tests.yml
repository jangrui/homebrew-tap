name: Tests

on:
  pull_request:
    paths:
      - "Casks/**"
      - "Formula/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
    inputs:
      packages:
        description: "要测试的包(空格分隔,如 Casks/foo.rb Formula/bar.rb;填 all 测试全部;留空则测试相对 main 的改动)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      casks: ${{ steps.detect.outputs.casks }}
      formulae: ${{ steps.detect.outputs.formulae }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PACKAGES:-}" ]; then
            if [ "$INPUT_PACKAGES" = "all" ]; then
              files=$(ls Casks/*.rb Formula/*.rb)
            else
              files=$(printf '%s\n' $INPUT_PACKAGES)
            fi
          else
            base="${BASE_SHA:-}"
            if [ -z "$base" ]; then
              git fetch --quiet origin main
              base=$(git merge-base origin/main HEAD)
            fi
            changed=$(git diff --name-only --diff-filter=AMR "$base" HEAD)
            if printf '%s\n' "$changed" | grep -qx '.github/workflows/tests.yml'; then
              echo "测试工作流本身有改动,测试全部包"
              files=$(ls Casks/*.rb Formula/*.rb)
            else
              files="$changed"
            fi
          fi
          to_json() { { grep -E "^$1/[^/]+\.rb$" || true; } | xargs -r -n1 basename | sed 's/\.rb$//' | jq -R . | jq -sc .; }
          casks=$(printf '%s\n' "$files" | to_json Casks)
          formulae=$(printf '%s\n' "$files" | to_json Formula)
          echo "casks=${casks}" >> "$GITHUB_OUTPUT"
          echo "formulae=${formulae}" >> "$GITHUB_OUTPUT"
          echo "Casks: ${casks}"
          echo "Formulae: ${formulae}"

  cask:
    needs: detect
    if: needs.detect.outputs.casks != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        cask: ${{ fromJSON(needs.detect.outputs.casks) }}
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      TOKEN: jangrui/tap/${{ matrix.cask }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1

      - name: Checkout tap
        uses: actions/checkout@v5

      - name: Style
        run: brew style --except-cops FormulaAudit/LivecheckUrlSymbol "$TOKEN"

      # audit 的部分规则与本 tap 约定冲突(如 auto-bump 依赖显式 version、livecheck 版本差异、
      # GitHub 资产可达性误报),只作提示不拦截;拦截以安装/测试为准。
      - name: Audit (advisory)
        run: |
          # 去掉 GITHUB_ACTIONS,避免 brew 把问题发成注解;问题只写入运行的 Summary 页
          set +e
          out=$(env -u GITHUB_ACTIONS brew audit --cask --online "$TOKEN" 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            {
              echo "### audit 提示:\`${TOKEN##*/}\`${RUNNER_OS:+ ($RUNNER_OS)}"
              echo ""
              printf '%s\n' "$out" | sed -E 's/\x1b\[[0-9;]*m//g' | sed -n 's/^ *\* /- /p'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Install
        run: brew install --cask --verbose "$TOKEN"

      - name: Uninstall
        run: brew uninstall --cask --force "$TOKEN"

  formula:
    needs: detect
    if: needs.detect.outputs.formulae != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        formula: ${{ fromJSON(needs.detect.outputs.formulae) }}
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      TOKEN: jangrui/tap/${{ matrix.formula }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1

      - name: Checkout tap
        uses: actions/checkout@v5

      - name: Style
        run: brew style --except-cops FormulaAudit/LivecheckUrlSymbol "$TOKEN"

      # audit 的部分规则与本 tap 约定冲突(如 auto-bump 依赖显式 version、livecheck 版本差异、
      # GitHub 资产可达性误报),只作提示不拦截;拦截以安装/测试为准。
      - name: Audit (advisory)
        run: |
          # 去掉 GITHUB_ACTIONS,避免 brew 把问题发成注解;问题只写入运行的 Summary 页
          set +e
          out=$(env -u GITHUB_ACTIONS brew audit --formula --online "$TOKEN" 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            {
              echo "### audit 提示:\`${TOKEN##*/}\`${RUNNER_OS:+ ($RUNNER_OS)}"
              echo ""
              printf '%s\n' "$out" | sed -E 's/\x1b\[[0-9;]*m//g' | sed -n 's/^ *\* /- /p'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Install
        run: brew install --formula --verbose "$TOKEN"

      - name: Test
        run: brew test --verbose "$TOKEN"

      - name: Uninstall
        run: brew uninstall --formula --force "$TOKEN"
