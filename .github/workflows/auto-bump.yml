name: Auto Bump

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1

      - name: Checkout tap
        uses: actions/checkout@v5

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect & bump changed casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          repo_name=$(gh repo view --json nameWithOwner --jq '.nameWithOwner') || { echo "❌ 无法识别当前仓库"; exit 1; }

          sync_main() {
            git fetch --quiet origin main || return 1
            git checkout -B main origin/main >/dev/null || return 1
          }

          push_branch() {
            local branch="$1" remote_sha
            remote_sha=$(git ls-remote --heads origin "$branch" | awk 'NR == 1 { print $1 }') || return 1
            if [ -n "$remote_sha" ]; then
              git push --force-with-lease="refs/heads/${branch}:${remote_sha}" origin "$branch"
            else
              git push origin "$branch"
            fi
          }

          read_pr_status() {
            gh pr view "$1" --json state,mergedAt,autoMergeRequest --jq '[.state,(.mergedAt // ""),(.autoMergeRequest != null)] | @tsv' 2>/dev/null || true
          }

          main_contains_pr_head() {
            local pr_ref="$1" number files path expected actual found=0
            number=$(gh pr view "$pr_ref" --json number --jq '.number') || return 1
            files=$(gh api "repos/${repo_name}/pulls/${number}/files?per_page=100" --paginate --jq '.[] | [.filename,.sha] | @tsv') || return 1
            while IFS=$'\t' read -r path expected; do
              [ -z "$path" ] && continue
              found=1
              actual=$(git rev-parse "origin/main:${path}" 2>/dev/null) || return 1
              [ "$actual" = "$expected" ] || return 1
            done <<< "$files"
            [ "$found" -eq 1 ]
          }

          close_stale_pr() {
            local pr_ref="$1" state head_ref
            state=$(gh pr view "$pr_ref" --json state --jq '.state') || return 1
            case "$state" in
              OPEN|CLOSED|MERGED) ;;
              *) return 1 ;;
            esac
            head_ref=$(gh pr view "$pr_ref" --json headRefName --jq '.headRefName') || return 1
            if [ "$state" = "OPEN" ]; then
              if ! gh pr close "$pr_ref" --comment "主线已包含该 PR 的全部文件内容,关闭状态残留的自动 bump PR。" >/dev/null; then
                state=$(gh pr view "$pr_ref" --json state --jq '.state' 2>/dev/null || true)
                case "$state" in
                  CLOSED|MERGED) ;;
                  *) return 1 ;;
                esac
              fi
            fi
            if [ -n "$head_ref" ]; then
              gh api --method DELETE "repos/${repo_name}/git/refs/heads/${head_ref}" >/dev/null 2>&1 || true
            fi
          }

          merge_pr() {
            local pr_ref="$1"
            local attempt output status verify
            for attempt in 1 2 3; do
              status=$(read_pr_status "$pr_ref")
              if [[ "$status" == MERGED$'\t'* ]]; then
                echo "✅ $pr_ref: PR 已合并"
                return 0
              fi
              if [[ "$status" == OPEN$'\t'*$'\ttrue' ]]; then
                echo "✅ $pr_ref: 自动合并已登记,等待 GitHub 完成"
                return 0
              fi
              output=""
              if output=$(gh pr merge "$pr_ref" --squash --auto 2>&1); then
                printf '%s\n' "$output"
                for verify in 1 2 3 4 5; do
                  status=$(read_pr_status "$pr_ref")
                  if [[ "$status" == MERGED$'\t'* ]]; then
                    echo "✅ $pr_ref: PR 已合并"
                    return 0
                  fi
                  if [[ "$status" == OPEN$'\t'*$'\ttrue' ]]; then
                    echo "✅ $pr_ref: 自动合并已登记,等待 GitHub 完成"
                    return 0
                  fi
                  [ "$verify" -lt 5 ] && sleep 2
                done
                if printf '%s\n' "$output" | grep -qiE 'will be (added to the merge queue|automatically merged)|already queued to merge'; then
                  echo "✅ $pr_ref: GitHub 已接受自动合并/入队请求"
                  return 0
                fi
              fi
              [ -n "${output:-}" ] && printf '%s\n' "$output"
              if [ "$attempt" -lt 3 ]; then
                echo "⚠️  $pr_ref: 自动合并命令失败,准备第 $((attempt + 1)) 次尝试"
                sleep $((attempt * 5))
              fi
            done
            status=$(read_pr_status "$pr_ref")
            if [[ "$status" == MERGED$'\t'* ]]; then
              echo "✅ $pr_ref: PR 已合并"
              return 0
            fi
            if [[ "$status" == OPEN$'\t'*$'\ttrue' ]]; then
              echo "✅ $pr_ref: 自动合并已登记,等待 GitHub 完成"
              return 0
            fi
            sync_main || { echo "❌ $pr_ref: 无法同步 origin/main 进行主线对账"; return 1; }
            if main_contains_pr_head "$pr_ref"; then
              echo "⚠️  $pr_ref: 主线已包含 PR 内容,关闭状态残留的 PR"
              close_stale_pr "$pr_ref" || { echo "❌ $pr_ref: 关闭状态残留 PR 失败"; return 1; }
              return 0
            fi
            status=$(read_pr_status "$pr_ref")
            if [[ "$status" == MERGED$'\t'* ]]; then
              echo "✅ $pr_ref: PR 已合并"
              return 0
            fi
            if [[ "$status" == OPEN$'\t'*$'\ttrue' ]]; then
              echo "✅ $pr_ref: 自动合并已登记,等待 GitHub 完成"
              return 0
            fi
            status=$(gh pr view "$pr_ref" --json state,mergeStateStatus,mergedAt,mergeCommit,autoMergeRequest --jq '[.state,.mergeStateStatus,(.mergedAt // ""),(.mergeCommit.oid // ""),(.autoMergeRequest != null)] | @tsv' 2>/dev/null || true)
            echo "❌ $pr_ref: 自动合并失败,PR 状态: ${status:-unknown}"
            return 1
          }

          apply_electron_builder_bump() {
            local name="$1" latest="$2"
            local cask_path="Casks/${name}.rb"
            local feed_url
            feed_url=$(awk '
              /livecheck do/ {in_lc=1; next}
              in_lc && /^  end/ {in_lc=0; next}
              in_lc && /url "[^"]+"/ {
                match($0, /url "[^"]+"/)
                url = substr($0, RSTART+5, RLENGTH-6)
                print url; exit
              }
            ' "$cask_path")
            if [ -z "$feed_url" ]; then
              feed_url=$(grep -E 'url "[^"]*latest-mac\.yml"' "$cask_path" | head -1 | sed -E 's/.*url "([^"]+)".*/\1/')
            fi
            [ -z "$feed_url" ] && { echo "⚠️  $name: 找不到 feed url(cask 没有 livecheck 块,也没有 latest-mac.yml)"; return 1; }
            echo "🚀 $name: electron_builder 路径 (feed=$feed_url)"

            local intel_feed_url=""
            if grep -qE 'on_arm do' "$cask_path" && grep -qE 'on_intel do' "$cask_path" \
               && echo "$feed_url" | grep -qE 'darwin-(aarch64|x86_64)'; then
              if echo "$feed_url" | grep -q 'darwin-aarch64'; then
                intel_feed_url="${feed_url/darwin-aarch64/darwin-x86_64}"
              elif echo "$feed_url" | grep -q 'darwin-x86_64'; then
                intel_feed_url="${feed_url/darwin-x86_64/darwin-aarch64}"
              fi
              [ -n "$intel_feed_url" ] && echo "    + intel fallback feed: $intel_feed_url"
            fi

            fetch_dmgs() {
              local feed="$1" prefer_arm_only="$2"
              while IFS='|' read -r arch_kind dmg_url server_sha; do
                [ -z "$dmg_url" ] && continue
                echo "${arch_kind}|${dmg_url}|${server_sha}"
              done < <(
                curl -fsSL "$feed" | ruby -ryaml -ruri -e '
                  prefer_arm_only = ARGV[0] == "true"
                  base = ARGV[1]
                  begin
                    y = YAML.load(STDIN)
                  rescue Psych::SyntaxError => e
                    warn "feed 不是合法 YAML(#{e.line}:#{e.column} #{e.problem}): $feed"
                    exit 1
                  end
                  unless y.is_a?(Hash) && y["files"].is_a?(Array)
                    warn "feed 不是 electron-builder 的 latest-mac.yml(缺 files[]): $feed"
                    exit 1
                  end
                  y["files"].to_a.each do |f|
                    u = f["url"].to_s
                    next unless u.end_with?(".dmg")
                    base_name = File.basename(u)
                    arch =
                      if base_name.include?("arm64") then "arm"
                      elsif base_name.include?("x64") || base_name.include?("x86_64") then "intel"
                      elsif prefer_arm_only then "arm"
                      else "intel"
                      end
                    encoded =
                      if u.match?(%r{\Ahttps?://})
                        u
                      else
                        base + "/" + URI::DEFAULT_PARSER.escape(u, /[^a-zA-Z0-9._~:\/-]/)
                      end
                    puts "#{arch}|#{encoded}|#{f["sha512"]}"
                  end
                ' "$prefer_arm_only" "${feed_url%/latest-mac.yml}"
              )
            }

            fetch_dmg_from_arch_feed() {
              local feed="$1" target_arch="$2"
              curl -fsSL "$feed" | ruby -ryaml -e '
                begin
                  y = YAML.load(STDIN)
                rescue Psych::SyntaxError => e
                  warn "feed 不是合法 YAML(#{e.line}:#{e.column} #{e.problem}): $feed"
                  exit 1
                end
                unless y.is_a?(Hash) && y["files"].is_a?(Array)
                  warn "feed 不是 electron-builder 的 latest-mac.yml(缺 files[]): $feed"
                  exit 1
                end
                y["files"].to_a.each do |f|
                  u = f["url"].to_s
                  next unless u.end_with?(".dmg")
                  base = File.basename(u)
                  next unless ARGV[0] == "arm"   ? base.include?("arm64") :
                                                  (base.include?("x64") || base.include?("x86_64"))
                  puts "#{u}|#{f["sha512"]}"
                  exit
                end
              ' "$target_arch"
            }

            local EMPTY_SHA="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
            local prefer_arm_only="false"
            if grep -q 'depends_on arch: :arm64' "$cask_path"; then
              prefer_arm_only="true"
            fi

            local arm_url="" arm_sha="" intel_url="" intel_sha=""
            while IFS='|' read -r arch_kind dmg_url server_sha; do
              [ -z "$dmg_url" ] && continue
              echo "  → [$arch_kind] $dmg_url"
              local tmp
              tmp=$(mktemp)
              if ! curl -fsSL "$dmg_url" -o "$tmp"; then
                rm -f "$tmp"
                echo "⚠️  $name: [$arch_kind] dmg 下载失败(curl exit 非 0): $dmg_url"
                return 1
              fi
              local bytes sha
              bytes=$(wc -c < "$tmp" | tr -d '[:space:]')
              if [ "${bytes:-0}" -eq 0 ]; then
                rm -f "$tmp"
                echo "⚠️  $name: [$arch_kind] dmg 是空文件(URL 错或 OSS 返回空对象): $dmg_url"
                return 1
              fi
              sha=$(ruby -e "require 'digest'; puts Digest::SHA256.hexdigest(File.binread('$tmp'))")
              rm -f "$tmp"
              if [ "$sha" = "$EMPTY_SHA" ]; then
                echo "⚠️  $name: [$arch_kind] sha256 是空字符串占位,跳过"
                return 1
              fi
              case "$arch_kind" in
                arm)
                  arm_url="$dmg_url"; arm_sha="$sha" ;;
                intel)
                  intel_url="$dmg_url"; intel_sha="$sha" ;;
              esac
              echo "    sha256: $sha ($bytes bytes)"
            done < <(fetch_dmgs "$feed_url" "$prefer_arm_only")

            if [ -z "$arm_url" ] && [ -z "$intel_url" ]; then
              echo "⚠️  $name: yml 里没找到 .dmg"; return 1
            fi
            if [ "$prefer_arm_only" = "true" ] && [ -z "$arm_url" ]; then
              echo "⚠️  $name: cask 是 arm64-only,但 yml 没出 arm64 dmg"; return 1
            fi

            if [ -z "$intel_url" ] && [ -n "$intel_feed_url" ]; then
              echo "  + 缺 intel dmg,补拉另一份 manifest"
              line=$(fetch_dmg_from_arch_feed "$intel_feed_url" "intel" || true)
              if [ -n "$line" ]; then
                intel_url="${line%%|*}"
                tmp=$(mktemp)
                if ! curl -fsSL "$intel_url" -o "$tmp"; then
                  rm -f "$tmp"
                  echo "⚠️  $name: [intel-fallback] dmg 下载失败: $intel_url"
                  return 1
                fi
                bytes=$(wc -c < "$tmp" | tr -d '[:space:]')
                if [ "${bytes:-0}" -eq 0 ]; then
                  rm -f "$tmp"
                  echo "⚠️  $name: [intel-fallback] dmg 是空文件: $intel_url"
                  return 1
                fi
                intel_sha=$(ruby -e "require 'digest'; puts Digest::SHA256.hexdigest(File.binread('$tmp'))")
                rm -f "$tmp"
                if [ "$intel_sha" = "$EMPTY_SHA" ]; then
                  echo "⚠️  $name: [intel-fallback] sha256 是空字符串占位,跳过"; return 1
                fi
                echo "    intel-fallback sha256: $intel_sha ($bytes bytes)"
              fi
            fi

            ruby -i -e '
              path, version, arm_url, arm_sha, intel_url, intel_sha, prefer_arm_only = ARGV
              src = File.read(path)
              src.sub!(/^  version "[^"]+"/, %Q(  version "#{version}"))
              arm_re   = /^(  on_arm do\n)(.*?)(^  end)$/m
              intel_re = /^(  on_intel do\n)(.*?)(^  end)$/m
              if src.match?(arm_re) && src.match?(intel_re)
                src.sub!(arm_re) do |block|
                  b = block
                  b = b.sub(/url "[^"]+"/,     %Q(url "#{arm_url}"))
                  b = b.sub(/sha256 "[^"]+"/,  %Q(sha256 "#{arm_sha}"))
                  b
                end
                src.sub!(intel_re) do |block|
                  b = block
                  b = b.sub(/url "[^"]+"/,     %Q(url "#{intel_url}"))
                  b = b.sub(/sha256 "[^"]+"/,  %Q(sha256 "#{intel_sha}"))
                  b
                end
              else
                target_url = arm_url.empty? ? intel_url : arm_url
                target_sha = arm_sha.empty? ? intel_sha : arm_sha
                src.sub!(/^  url "[^"]+"/,     %Q(  url "#{target_url}"))
                src.sub!(/^  sha256 "[^"]+"/,  %Q(  sha256 "#{target_sha}"))
              end
              File.write(path, src)
            ' "$cask_path" "$latest" \
              "$arm_url" "$arm_sha" \
              "$intel_url" "$intel_sha" \
              "$prefer_arm_only"

            brew style "$cask_path" >/dev/null || { echo "⚠️  $name: brew style 失败,回滚"; git checkout -- "$cask_path"; return 1; }

            local current
            current=$(git show HEAD:"$cask_path" | grep -E '^  version "' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            git add "$cask_path" || return 1
            git commit -m "auto-bump($name): $current → $latest" >/dev/null || return 1
            local branch="bump-${name}-${latest}"
            git checkout -B "$branch" || return 1
            push_branch "$branch" >/dev/null || return 1
            git checkout main >/dev/null || return 1
            echo "✅ $name: 已推到分支 $branch"
          }

          apply_multiarch_formula_bump() {
            local name="$1" latest="$2"
            local formula_path="Formula/${name}.rb"
            echo "🚀 $name: multi-arch formula 路径(逐 url stanza 重算 sha256)"

            if ! ruby - "$formula_path" "$latest" <<'RUBY'; then
              require "digest"
              require "tmpdir"

              path, latest = ARGV
              empty_sha = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
              lines = File.read(path).lines
              failures = []

              i = 0
              while i < lines.length
                if lines[i] =~ /^[ \t]*url "([^"]+)"/
                  template = $1
                  sha_idx = nil
                  j = i + 1
                  while j < lines.length && j <= i + 3
                    break if lines[j] =~ /^[ \t]*url "/
                    if lines[j] =~ /^[ \t]*sha256 "[0-9a-f]{64}"/
                      sha_idx = j
                      break
                    end
                    j += 1
                  end

                  if sha_idx
                    unless template.include?('#{version}')
                      failures << "url 不含 \#{version} 模板,无法推导新版地址: #{template}"
                      i += 1
                      next
                    end
                    concrete = template.gsub('#{version}', latest)
                    puts "  → #{concrete}"
                    sha = nil
                    Dir.mktmpdir do |dir|
                      tmp = File.join(dir, "dl")
                      if !system("curl", "-fsSL", "--retry", "3", concrete, "-o", tmp)
                        failures << "下载失败: #{concrete}"
                      elsif File.size(tmp).zero?
                        failures << "下载是空文件: #{concrete}"
                      else
                        sha = Digest::SHA256.file(tmp).hexdigest
                      end
                    end
                    if sha == empty_sha
                      failures << "sha256 是空字符串占位: #{concrete}"
                    elsif sha
                      lines[sha_idx] = lines[sha_idx].sub(/sha256 "[0-9a-f]{64}"/, %Q(sha256 "#{sha}"))
                      puts "    sha256: #{sha}"
                    end
                    i = sha_idx
                  end
                end
                i += 1
              end

              unless failures.empty?
                failures.each { |f| warn "⚠️  #{f}" }
                exit 1
              end

              src = lines.join
              unless src.sub!(/^  version "[^"]+"/, %Q(  version "#{latest}"))
                warn "⚠️  没找到 version stanza"
                exit 1
              end
              File.write(path, src)
          RUBY
              echo "⚠️  $name: 多架构重写失败,文件未改动"
              return 1
            fi

            brew style --except-cops FormulaAudit/LivecheckUrlSymbol "$formula_path" >/dev/null || { echo "⚠️  $name: brew style 失败,回滚"; git checkout -- "$formula_path"; return 1; }

            local current
            current=$(git show HEAD:"$formula_path" | grep -E '^  version "' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            git add "$formula_path" || return 1
            git commit -m "auto-bump($name): $current → $latest" >/dev/null || return 1
            local branch="bump-${name}-${latest}"
            git checkout -B "$branch" || return 1
            push_branch "$branch" >/dev/null || return 1
            git checkout main >/dev/null || return 1
            echo "✅ $name: 已推到分支 $branch"
          }

          bump_one() {
            local kind="$1" name="$2"
            local flag="--cask"; [ "$kind" = "formula" ] && flag="--formula"
            local bump_cmd="bump-cask-pr"; [ "$kind" = "formula" ] && bump_cmd="bump-formula-pr"

            sync_main || { echo "❌ $name: 无法同步 origin/main"; return 1; }

            echo "============================================"
            echo "Livecheck ($kind): $name"
            result=$(HOMEBREW_NO_COLOR=1 brew livecheck "$flag" "$name" 2>&1 || true)
            echo "$result"
            clean=$(echo "$result" | sed -E 's/\x1b\[[0-9;]*m//g')
            matched=$(echo "$clean" | grep -iE "^${name}:" || true)
            latest=$(echo "$matched" | sed -E 's/.*==> *//' | tail -1 | tr -d '[:space:]')
            current=$(echo "$matched" | sed -E 's/^[^:]+: *//; s/ *==>.*//' | tail -1 | tr -d '[:space:]')

            if [ -z "$latest" ] || [ "$latest" = "N/A" ]; then
              echo "⚠️  $name: 查不到最新版本,跳过"
              return
            fi

            echo "当前版本: $current / 最新版本: $latest"
            local branch="bump-${name}-${latest}"

            if [ "$current" = "$latest" ]; then
              open_pr_url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty') || { echo "❌ $name: 无法查询 OPEN PR"; return 1; }
              if [ -n "$open_pr_url" ]; then
                sync_main || { echo "❌ $name: 无法同步 origin/main 清理状态残留 PR"; return 1; }
                if main_contains_pr_head "$open_pr_url"; then
                  close_stale_pr "$open_pr_url" || { echo "❌ $name: 关闭状态残留 PR 失败"; return 1; }
                else
                  echo "❌ $name: OPEN PR 内容未完全落地主线: $open_pr_url"
                  return 1
                fi
              fi
              echo "✅ $name 已是最新,无需更新"
              return
            fi

            newer=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)
            if [ "$newer" != "$latest" ]; then
              echo "✅ $name 配方版本($current)领先上游报告($latest),跳过防止降级"
              return
            fi

            sync_main || { echo "❌ $name: 无法同步 origin/main"; return 1; }

            if [ "$kind" = "cask" ] && ! grep -qE 'url "[^"]*#\{version\}' "Casks/${name}.rb"; then
              apply_electron_builder_bump "$name" "$latest" || return 1
            elif [ "$kind" = "formula" ] && [ "$(awk '/livecheck do/{lc=1} lc&&/^  end/{lc=0; next} !lc&&/^[[:space:]]+url "/{n++} END{print n+0}' "Formula/${name}.rb")" -gt 1 ]; then
              apply_multiarch_formula_bump "$name" "$latest" || return 1
            else
              echo "🚀 $name: $current → $latest,开始 bump"
              style_flag="--no-style"; [ "$kind" = "formula" ] && style_flag=""
              brew "$bump_cmd" "$name" \
                --version="$latest" \
                --message="auto-bump: $current → $latest" \
                --no-audit \
                $style_flag \
                --write-only \
                --commit || { echo "⚠️  $bump_cmd --write-only 失败,见上方日志"; return 1; }

              git checkout -B "$branch" || { echo "❌ $name: 无法创建 bump 分支"; return 1; }
              push_branch "$branch" || { echo "❌ $name: 无法推送 bump 分支"; return 1; }
              git checkout main || { echo "❌ $name: 无法切回 main"; return 1; }
            fi

            expected_head=$(git rev-parse "$branch") || { echo "❌ $name: 无法读取 bump 分支 head"; return 1; }
            open_pr_url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty') || { echo "❌ $name: 无法查询 OPEN PR"; return 1; }
            if [ -n "$open_pr_url" ]; then
              echo "ℹ️  $name: 已有 OPEN 状态的 PR,尝试自动合并"
              pr_url="$open_pr_url"
            else
              pr_body=$(printf '自动同步上游版本。\n\n- 类型: `%s`\n- 旧版本: `%s`\n- 新版本: `%s`\n\n由 GitHub Actions 自动生成并合并。' "$kind" "$current" "$latest")
              pr_url=$(gh pr create --title "bump ${name} ${current} → ${latest}" --body "$pr_body" --base main --head "$branch") || { echo "❌ $name: 无法创建 PR"; return 1; }
              echo "✅ PR 已创建: $pr_url"
              sleep 2
            fi
            pr_head=$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid') || { echo "❌ $name: 无法读取 PR head"; return 1; }
            if [ "$pr_head" != "$expected_head" ]; then
              echo "❌ $name: PR head 与本轮推送不一致(期望 $expected_head,实际 $pr_head)"
              return 1
            fi
            merge_pr "$pr_url" || { echo "❌ 自动合并未成功: $pr_url"; return 1; }
            echo "✅ PR 自动合并请求已处理"
          }

          errors=0
          for f in Casks/*.rb; do
            bump_one cask "$(basename "$f" .rb)" || errors=$((errors+1))
          done
          for f in Formula/*.rb; do
            bump_one formula "$(basename "$f" .rb)" || errors=$((errors+1))
          done

          echo "============================================"
          if [ "$errors" -gt 0 ]; then
            echo "❌ 完成,但有 $errors 个包 bump 失败(见上方 ⚠️ 日志)"
            exit 1
          fi
          echo "完成。如有更新,PR 会自动合并到 main(无需人工干预)。"
